name: Build & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build Docker image
        run: docker build -t $IMAGE:sha-${{ github.sha }} .

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag $IMAGE:sha-${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:sha-${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:latest
            sudo systemctl restart gpt-bot-ts
            sleep 5
            systemctl is-active --quiet gpt-bot-ts || (echo "Service not active"; sudo journalctl -u gpt-bot-ts --no-pager -n 30; exit 1)
            curl -sf http://127.0.0.1:8089/health || (echo "Health check failed"; sudo journalctl -u gpt-bot-ts --no-pager -n 30; exit 1)
            echo "Deploy successful"
